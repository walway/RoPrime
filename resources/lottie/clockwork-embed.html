<!DOCTYPE html>
<html lang="en">
	<head>

		<title>Profile effect preview</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: transparent;
				-webkit-user-select: none;
				-ms-user-select: none;
				user-select: none;
			}

			#container {
				width: 100%;
				height: 100%;

				overflow: hidden;
				background: #181d24;
				-webkit-user-select: none;
				-ms-user-select: none;
				user-select: none;
			}

			#container svg {
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="container"></div>
		<script src="../vendor/lottie.min.js"></script>
